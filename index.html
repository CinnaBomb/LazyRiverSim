<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lazy River Sim</title><style>body{margin:0;overflow:hidden;background:#183c40;font:15px system-ui;color:white}#panel{position:absolute;top:16px;left:16px;background:#123b3bd9;padding:16px;border-radius:14px;max-width:280px}h1{font-size:22px;margin:0 0 8px}button,input{accent-color:#5ed8c4}button{padding:8px;border:0;border-radius:6px;margin-top:8px}canvas{display:block;touch-action:none}#panel{z-index:5;top:max(12px,env(safe-area-inset-top));left:12px;background:#16362ed9;backdrop-filter:blur(12px);padding:9px 12px}#panel:not([open]){background:#16362eaa;padding:5px 10px}summary{cursor:pointer;font-size:13px;list-style:none;user-select:none}summary::-webkit-details-marker{display:none}#panel[open] summary{margin-bottom:12px}#panel[open] summary:after{content:'  ×'}#panel:not([open]) summary:before{content:'⚙  '}#panel h1{font-size:17px}#panel p{font-size:12px}#panel small{font-size:11px}#status{opacity:.7}#VRButton{font-size:12px!important;opacity:.8!important}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><details id="panel"><summary>Settings</summary><h1>Lazy River Sim</h1>Drift through a tropical garden.<p>Drag or swipe to look around. In VR, use your head to look and either trigger to pause.</p><label>Current speed <input id="speed" type="range" min="0" max="1.5" step=".05" value="0.65"></label><br><button id="pause">Pause drift</button> <button id="sound">Enable water sounds</button><select id="quality" aria-label="Graphics quality"><option value="balanced">Balanced / VR</option><option value="high">High quality</option></select><small>Visual build 5</small><p id="status">Loading natural assets…</p><small>Powered by <a style="color:white" href="https://polyhaven.com/">Poly
