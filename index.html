<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lazy River Sim</title><style>body{margin:0;overflow:hidden;background:#183c40;font:15px system-ui;color:white}#panel{position:absolute;top:16px;left:16px;background:#123b3bd9;padding:16px;border-radius:14px;max-width:280px}h1{font-size:22px;margin:0 0 8px}button,input{accent-color:#5ed8c4}button{padding:8px;border:0;border-radius:6px;margin-top:8px}canvas{display:block;touch-action:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="panel"><h1>Lazy River Sim</h1>Drift through a tropical garden.<p>Drag or swipe to look around. In VR, use your head to look and either trigger to pause.</p><label>Current speed <input id="speed" type="range" min="0" max="1.5" step=".05" value="0.65"></label><br><button id="pause">Pause drift</button> <button id="sound">Enable water sounds</button><select id="quality" aria-label="Graphics quality"><option value="balanced">Balanced / VR</option><option value="high">High quality</option></select><p id="status">Loading natural assets…</p><small>Powered by <a style="color:white" href="https://polyhaven.com/">Poly Haven</a> (CC0)</small></div><script type="module" src="main.js"></script></body></html>
